name: Tests

on:
  push:
  pull_request:

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    # The app targets macOS 26, so the tests need that system and its Xcode.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test
